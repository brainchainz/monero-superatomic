user asb;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  access_log /var/log/nginx/access.log;

  server {
    listen 8080;
    server_name _;
    root /app/frontend/dist;
    index index.html;

    # NOTE on network isolation: Umbrel's compose overlay maps every app's
    # "default" network onto the shared umbrel_main_network, so a private
    # per-app subnet does not exist and an IP allow-list cannot distinguish the
    # app_proxy from other app containers. Access control is Umbrel's app_proxy
    # session plus the dashboard's own password on every sensitive action.

    # The SPA is fully self-contained (fonts bundled, no third-party calls).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api {
      # Backup restore uploads a whole node archive; nginx's 1m default
      # rejected it with 413. Stream it through without buffering to disk.
      client_max_body_size 600m;
      proxy_request_buffering off;
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets are immutable, so cache them hard. Critically, a
    # missing one must 404 rather than fall through to index.html: serving HTML
    # for a .js request returns 200 and the browser then parses HTML as
    # JavaScript, which renders a blank page with no error in the log.
    # nginx drops inherited add_header directives as soon as a location sets one
    # of its own, so the security headers are repeated in every location that
    # adds anything. Leaving them out here would silently un-set the CSP.

    # The entry bundle has a fixed name, so it must be revalidated rather than
    # cached, otherwise an update would serve yesterday's app from disk.
    location ~ ^/assets/index\.(js|css)$ {
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Releases before the fixed entry name shipped hashed bundles. A browser
    # still holding one of those pages asks for a hash this image does not
    # have; serve it the current entry instead so the update heals itself
    # rather than leaving the user staring at a blank screen.
    location ~ ^/assets/index-[A-Za-z0-9_-]+\.js$ {
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri /assets/index.js;
    }
    location ~ ^/assets/index-[A-Za-z0-9_-]+\.css$ {
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri /assets/index.css;
    }

    # Chunks and fonts keep content hashes, so they are safe to cache forever.
    # A missing one must 404 rather than fall through to index.html: serving
    # HTML for a .js request returns 200 and the browser then parses HTML as
    # JavaScript, which renders a blank page with no error in the log.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Never cache the entry document. It names the hashed bundles, so a stale
    # copy points at filenames a newer image no longer contains, which is
    # exactly how an update turns into a blank screen until a hard refresh.
    location = /index.html {
      add_header Cache-Control "no-store, must-revalidate" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
