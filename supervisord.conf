[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[inet_http_server]
port=127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001

[program:log-janitor]
command=/app/scripts/log-janitor.sh
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
user=asb
environment=HOME="/tmp",USER="asb"

[program:monero-proxy]
command=node /app/scripts/monero-proxy.mjs
autostart=true
autorestart=true
priority=5
stdout_logfile=/data/logs/monero-proxy.out.log
stderr_logfile=/data/logs/monero-proxy.err.log
user=asb
environment=HOME="/tmp",USER="asb"

[program:asb]
command=/app/scripts/start-asb.sh
autostart=true
autorestart=true
priority=10
stdout_logfile=/data/logs/asb.out.log
stderr_logfile=/data/logs/asb.err.log
user=asb
environment=HOME="/tmp",USER="asb"

[program:dashboard]
command=node /app/backend/server.js
autostart=true
autorestart=true
priority=20
stdout_logfile=/data/logs/dashboard.out.log
stderr_logfile=/data/logs/dashboard.err.log
user=asb
environment=HOME="/tmp",USER="asb"

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/data/logs/nginx.out.log
stderr_logfile=/data/logs/nginx.err.log
user=asb
